<nav class="navbar enhanced-navbar top-navbar" aria-label="Main navigation">
  <div class="navbar-content">
    <a class="navbar-logo" routerLink="/home" aria-label="Books and Beans Cafe home">
      <span class="logo-mark">
        <img src="../../../src/app/images/Bylz_logo.svg" alt="Books and Beans Cafe logo" />
      </span>
      <span class="navbar-title">
        <span class="main-title">Books & Beans Cafe</span>
        <span class="subtitle"><span class="subtitle-dot">●</span> Sip. Read. Repeat.</span>
      </span>
    </a>
    <button 
      class="hamburger"
      type="button"
      aria-label="Toggle navigation menu"
      aria-haspopup="true"
      [attr.aria-expanded]="showMobileNav"
      aria-controls="main-navigation"
      (click)="showMobileNav = !showMobileNav"
    >
      <span></span><span></span><span></span>
    </button>

    <ul id="main-navigation" class="nav-items enhanced-nav" [class.show]="showMobileNav" [attr.aria-hidden]="!showMobileNav">
      <ng-container *ngFor="let nav of [
        { link: '/manage', icon: '🛠️', text: 'Manage', click: 'showmanagefun()' },
        { link: '/dashboard', icon: '🏠', text: 'Dashboard', click: 'showdashboardfun()' },
        { link: '/tables', icon: '🍽️', text: 'Tables', click: 'showtablefun()' },
        { link: '/orders', icon: '🧾', text: 'Orders', click: 'showordersfun()' },
        { link: '/home', icon: '📑', text: 'Menu', click: 'showhomefun()' },
        { link: '/customers', icon: '👥', text: 'Customers', click: 'showcustomersfun()' },
        { link: '/imf', icon: '📦', text: 'Inventory', click: null }
      ]">
        <li>
          <a 
            [routerLink]="nav.link"
            *ngIf="nav.click; else noClick"
            (click)="
              showMobileNav = false;
              nav.click === 'showmanagefun()' ? showmanagefun()
              : nav.click === 'showdashboardfun()' ? showdashboardfun()
              : nav.click === 'showtablefun()' ? showtablefun()
              : nav.click === 'showordersfun()' ? showordersfun()
              : nav.click === 'showhomefun()' ? showhomefun()
              : nav.click === 'showcustomersfun()' ? showcustomersfun()
              : null
            "
          >
            <span class="nav-icon" aria-hidden="true">{{nav.icon}}</span><span class="nav-label">{{nav.text}}</span>
          </a>
          <ng-template #noClick>
            <a [routerLink]="nav.link" (click)="showMobileNav = false">
              <span class="nav-icon" aria-hidden="true">{{nav.icon}}</span><span class="nav-label">{{nav.text}}</span>
            </a>
          </ng-template>
        </li>
      </ng-container>
    </ul>

    <details class="profile profile-menu">
      <summary class="profile-initials" aria-label="Open profile menu">B&amp;B</summary>
      <div class="dropdown-menu" id="profileDropdown">
        <div class="profile-details">
          <div class="profile-avatar" aria-hidden="true">
            <i class="fa fa-user-circle"></i>
          </div>
          <div>
            <span class="profile-name">Welcome back</span>
            <div class="profile-email">info@booksnbeans.cafe</div>
          </div>
        </div>
        <ul>
          <li *ngFor="let option of profileOptions">
            <a href="#" (click)="$event.preventDefault()">
              <i class="fa" [ngClass]="option.icon"></i> {{ option.label }}
            </a>
          </li>
        </ul>
      </div>
    </details>
  </div>
</nav>
