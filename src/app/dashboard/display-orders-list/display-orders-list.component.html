                                                                                
<style>
    .order-list-container {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: clamp(0.75rem, 2vw, 1.5rem);
        overflow: hidden;
    }

    .order-list-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .sales-tabs-container {
        flex: 1 1 30rem;
        min-width: 0;
    }

    .search-bar {
        display: block;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
    }

    .tabs-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
    }

    .orders-table-wrapper {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 600px) {
        .order-list-header h2 {
            width: 100%;
            margin-bottom: 0;
        }

        .tabs-group {
            align-items: stretch;
        }

        .tabs-group .tab,
        .tabs-group input[type="date"] {
            flex: 1 1 100%;
            width: 100%;
        }
    }
</style>

<app-display-orders-in-box [ordercount]="ordercount" [totaldiscountamount]="totaldiscountamount" [totalpendingamount]="totalpendingamount" [totalorderamount]="totalorderamount"></app-display-orders-in-box>
<div class="order-list-container">
    <!-- Top Section -->
    <div class="order-list-header">
        <h2>Order List</h2>
        <div class="sales-tabs-container">
            <input type="text" class="search-bar" (keyup)="findorders()" [(ngModel)]="searchdata" placeholder="Search orders..." />
            <div class="tabs-group">
                <button class="tab " (click)="loadtoday()">Today</button>
                <button class="tab"  (click)="loadyesterday()">Yesterday</button>
                <button class="tab" (click)="loadweek()">This Week(7days)</button>
                <button class="tab" (click)="loadmonth()">This Month</button>
               | From: <input class="tab" type="date" (click)="validate()" (change)="fromdate()" max="{{currentDateTime}}" [(ngModel)]="from_date" id="f">| To:
                <input class="tab" type="date" [ngModel]="dateValue" (ngModelChange)="dateValue = $event" (change)="todate()" (click)="validateto()"  [(ngModel)]="to_date" id="t">
            </div>
        </div>
    </div>
    <div>
<app-order-diplay-in-pop-up
    [customers]="customersRecord"
    [EditOrderInvoice]="EditOrder"
    [EditOrderItems]="EditOrderItems"
    [showPopUp]="showPopUp"
    [closePopUp]="closePopUp"
    [CustomerPaymentHistory$]="CustomerPaymentHistory$"
    (closePopUpByChild)="closePopUpByChild($event)"
    (ReInitializeEditOrderInvoice)="reInitializeEditOrderInvoice($event)">
</app-order-diplay-in-pop-up>
    </div>
