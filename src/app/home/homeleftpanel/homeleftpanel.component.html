<div class="category-sidebar-custom">
  <div class="category-header-custom">
    <div class="category-title-group">
      <span class="category-emoji">🍽️</span>
      <!-- category-title -->
      <span class="lbl">Food Billing</span>
    </div>
    <div class="category-desc">
      <i class="fa fa-star"></i>
      <!-- pos-hl -->
      <span>Fine Dining <span class=" lbl">POS</span></span>
    </div>
  </div>
  <div class="category-label">
    <span class="category-label-content">
      <i class="fa fa-list-ul"></i>
      <span class="lbl">Categories</span>
    </span>
  </div>
  <ul class="category-list-custom">
    <ng-container *ngIf="(categorynamedata$ | async) as categories">
      <li *ngFor="let category of categories" class="category-list-item-custom">
        <button
          type="button"
          (click)="getproductbycategory(category?._id)"
          class="category-button-custom"
          [ngClass]="{'top-selling-btn': category?._id === '999'}"
        >
          <span class="cat-icon">
            <i class="fa"
              [ngClass]="{
                'fa-fire': category?._id === '999', 
                'fa-inbox': category?._id !== '999'
              }"
            ></i>
          </span>
          <span>
            <span *ngIf="category?._id === '999'" class="cat-top-selling">
              <i class="fa fa-trophy"></i>
              Top Selling
            </span>
            <span *ngIf="category?._id !== '999'" class="cat-name">{{ category?.name }}</span>
          </span>
          
        </button>
      </li>
    </ng-container>
  </ul>
</div>

<!-- Custom Styles -->
<style>
.category-sidebar-custom {
  
 z-index: 1;
  align-items: center;

  overflow: visible;
  backdrop-filter: blur(2.5px);
}

  display: flex;

}
.category-title-group {

  font-size: 2.14rem;

  color: #d4a153;

}

.category-desc {
  color: #ab7a5c;

.category-label {

.category-list-custom {

.cat-top-selling {
