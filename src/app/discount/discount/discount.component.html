<div class="discount-form-container">
  <form [formGroup]="myAddForm" (ngSubmit)="onFormSubmit(myAddForm)" novalidate class="discount-form">
    <div class="form-row form-row--two">
      <div class="form-group field-group">
        <label for="name">Discount Name</label>
        <input
          type="text"
          id="name"
          class="form-control"
          formControlName="name"
          required
          minlength="2"
          maxlength="100"
          placeholder="Enter discount name"
        />
      </div>

      <div class="form-group field-group">
        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          class="form-control"
          formControlName="amount"
          required
          min="0.01"
          step="0.01"
          max="999999"
          placeholder="Enter discount value"
        />
      </div>
    </div>

    <div class="form-row form-row--two">
      <div class="form-group field-group">
        <label for="type">Discount Type</label>
        <select
          id="type"
          class="form-control"
          formControlName="type"
          required
        >
          <option value="" disabled>Select type</option>
          <option value="percentage">Percentage</option>
          <option value="fixed">Fixed</option>
        </select>
      </div>

      <div class="form-group field-group">
        <label for="description">Description <span class="text-muted">(optional)</span></label>
        <textarea
          id="description"
          class="form-control"
          formControlName="description"
          rows="2"
          maxlength="300"
          placeholder="Description (optional)"
        ></textarea>
      </div>
    </div>

    <div class="form-group form-check">
      <input
        type="checkbox"
        id="active"
        class="form-check-input"
        formControlName="active"
      />
      <label class="form-check-label" for="active">Active</label>
    </div>

    <div class="form-row form-row--two">
      <div class="form-group field-group">
        <label for="validFrom">Valid From <span class="text-muted">(optional)</span></label>
        <input
          type="date"
          id="validFrom"
          class="form-control"
          formControlName="validFrom"
        />
      </div>

      <div class="form-group field-group">
        <label for="validTo">Valid To <span class="text-muted">(optional)</span></label>
        <input
          type="date"
          id="validTo"
          class="form-control"
          formControlName="validTo"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="employee_id">Employee ID <span class="text-muted">(optional)</span></label>
      <input
        type="text"
        id="employee_id"
        class="form-control"
        formControlName="employee_id"
        maxlength="50"
        pattern="^[a-zA-Z0-9_-]*$"
        placeholder="Enter employee ID"
      />
    </div>

    <div class="form-group mt-3">
      <button type="submit" class="btn btn-primary">
        Save Discount
      </button>
    </div>
  </form>
</div>
